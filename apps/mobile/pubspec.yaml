name: geosentry_mobile
description: "GeoSentry Mobile App - Offline Geofencing & Landslide Early Warning"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  sqflite: ^2.3.0
  path: ^1.8.3
  geolocator: ^10.1.0
  flutter_local_notifications: ^17.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7
  latlong2: ^0.9.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
