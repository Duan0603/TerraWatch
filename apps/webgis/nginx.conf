server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA route shares its name with public/model-demo/ data assets.
    # Serve the page explicitly: a directory redirect would otherwise drop
    # Docker's published port, and the trailing-slash directory returns 403.
    location = /model-demo {
        try_files /index.html =404;
    }

    location = /model-demo/ {
        try_files /index.html =404;
    }

    # nginx:alpine không có .mjs trong mime.types mặc định -> bị trả về
    # application/octet-stream, khiến trình duyệt từ chối nạp Web Worker dạng
    # module (maplibre-gl-worker.mjs), làm bản đồ vector không vẽ được gì.
    # Chỉ set riêng cho .mjs qua location, KHÔNG dùng khối `types {}` ở server
    # level vì nó sẽ thay thế toàn bộ bảng MIME mặc định (html, css, svg...).
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page that names the current hashed bundles must never be served from the browser cache,
    # otherwise a rebuilt app keeps showing the old screens until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
