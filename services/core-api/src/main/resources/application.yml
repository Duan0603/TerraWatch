server:
  port: 3000

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Firebase project whose Google sign-in ID tokens Core API accepts (/api/v1/auth/google)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:terrawatch-ac26f}
  service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}

spring:
  application:
    name: terrawatch-core-api
  # Story 4.21: Gmail SMTP for the password reset code. Needs a Gmail "app password" in MAIL_PASSWORD;
  # without MAIL_USERNAME the e-mail reset answers 503 "chưa cấu hình".
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/terrawatch?currentSchema=core_schema,gis_schema,public}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: core_schema

  # Message Broker / Event Bus (Redis 7)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Automatic Database Migrations (Logical Schema-per-Service: Phương án A)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: core_schema,gis_schema
    default-schema: core_schema

# Circuit Breaker & Fault Tolerance (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      gisService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5000ms

# External Microservices URLs (Service Discovery via Docker Network DNS)
services:
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8001}
  gis:
    url: ${GIS_SERVICE_URL:http://localhost:8002}

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    vn.terrawatch: DEBUG
    org.springframework.security: WARN


# Story 4.39: SMS Gateway (eSMS / Twilio)
sms:
  provider: ${SMS_PROVIDER:}
  hotline: ${SMS_HOTLINE:112}
esms:
  api-key: ${ESMS_API_KEY:}
  secret-key: ${ESMS_SECRET_KEY:}
  brandname: ${ESMS_BRANDNAME:Baotrixemay}
  sandbox: ${ESMS_SANDBOX:0}
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

# Story 4.1: Forecast job orchestration
forecast:
  recovery:
    poll-interval-ms: ${FORECAST_RECOVERY_POLL_MS:60000}
    stuck-timeout-minutes: ${FORECAST_STUCK_TIMEOUT_MIN:5}
  job:
    max-retries: ${FORECAST_MAX_RETRIES:3}
