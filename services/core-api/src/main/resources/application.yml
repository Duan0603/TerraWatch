server:
  port: 3000

spring:
  application:
    name: terrawatch-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/terrawatch?currentSchema=core_schema,gis_schema,public}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: core_schema

  # Automatic Database Migrations (Logical Schema-per-Service: Phương án A)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: core_schema,gis_schema
    default-schema: core_schema

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    vn.terrawatch: DEBUG
    org.springframework.security: WARN
