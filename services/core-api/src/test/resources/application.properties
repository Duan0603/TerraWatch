# Dedicated test database; never inherit DATABASE_URL from the running application.
spring.datasource.url=${AUTH_TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/auth_story_1_1_test}
spring.datasource.username=${AUTH_TEST_DB_USER:postgres}
spring.datasource.password=${AUTH_TEST_DB_PASSWORD:postgrespassword}
spring.jpa.show-sql=false
jwt.secret=test-only-secret-at-least-thirty-two-bytes-long
jwt.expiration-ms=60000
