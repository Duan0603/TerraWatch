name: CI - WebGIS E2E

on:
  push:
    paths:
      - 'apps/webgis/**'
      - '.github/workflows/ci-webgis-e2e.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'apps/webgis/**'
      - '.github/workflows/ci-webgis-e2e.yml'
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webgis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/webgis/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The 4 tests under "sign-in by role" (auth.spec.js) call a real gateway on
      # localhost:8080 instead of the mockBackend stub, so they cannot pass without
      # the full docker compose stack. Every other spec is stubbed via page.route.
      - name: Run Playwright specs
        env:
          E2E_BROWSER: chromium
        run: npx playwright test --grep-invert "sign-in by role"
