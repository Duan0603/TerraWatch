name: CI - Core API Service

on:
  push:
    paths:
      - 'services/core-api/**'
      - '.github/workflows/ci-core-api.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'services/core-api/**'
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/core-api/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build
