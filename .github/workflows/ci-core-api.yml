name: CI - Core API Service (Spring Boot 3)

on:
  push:
    paths:
      - 'services/core-api/**'
      - '.github/workflows/ci-core-api.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'services/core-api/**'
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -B
