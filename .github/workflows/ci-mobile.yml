name: CI - Mobile App

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # pubspec.lock requires flutter >=3.44.0 / dart >=3.12.0; 3.47.3 is the version the project is developed with.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Fails on errors only. Tolerates the 3 existing findings (1 warning, 2 infos); fix them, then drop the flags.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: flutter test
