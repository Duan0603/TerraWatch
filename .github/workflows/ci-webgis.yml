name: CI - WebGIS Dashboard

on:
  push:
    paths:
      - 'apps/webgis/**'
      - '.github/workflows/ci-webgis.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'apps/webgis/**'
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webgis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/webgis/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite App
        run: npm run build
