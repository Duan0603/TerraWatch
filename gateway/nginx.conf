events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream response time & request ID
    log_format microservices '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log microservices;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting: 50 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstream Microservices Definitions (Docker Internal DNS)
    upstream core_api_upstream {
        server core-api:3000;
        keepalive 32;
    }

    upstream ai_service_upstream {
        server ai-service:8001;
        keepalive 16;
    }

    upstream gis_service_upstream {
        server gis-service:8002;
        keepalive 16;
    }

    upstream webgis_upstream {
        server webgis:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Global CORS Headers
        # Gateway owns CORS for every proxy, including docs, tiles and upstream errors.
        # proxy_hide_header here is inherited by every nested location with its own proxy_pass
        # (verified live) -- do NOT re-add these two lines per-location, that was dead/redundant
        # duplication found and removed in Story 1.3's review.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-Id' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Preflight OPTIONS Requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Check
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"terrawatch-api-gateway","timestamp":"$time_iso8601"}';
        }

        # 1. Core API Routing (controller paths preserved; /core/ remains a client alias)
        #
        # core-api's own Spring Security CORS config (SecurityConfig.corsConfigurationSource)
        # ALSO sets Access-Control-Allow-Origin on every response. Combined with this server
        # block's blanket `add_header ... always` above, the browser receives TWO ACAO values
        # on the same response ("http://localhost:5173, *") and rejects the response outright
        # ("multiple values ... only one is allowed") -- this silently broke every real
        # cross-origin request through the gateway to core-api, confirmed live for both
        # /api/v1/auth/login and /api/v1/core/landslides. `proxy_hide_header` strips the
        # upstream's copy so only this gateway's single header reaches the browser.
        #
        # This location is an alias so the WebGIS client can call /api/v1/core/<path> and reach
        # core-api's real /api/v1/<path> routes (used by landslideApi.js). A bare `proxy_pass
        # http://core_api_upstream/` here strips the WHOLE /api/v1/core/ prefix and forwards
        # just "<path>" with no /api/v1/ at all -- no controller matches that, Spring Security's
        # final .anyRequest().authenticated() catches it, and every call 401s (confirmed live:
        # GET /api/v1/core/landslides -> 401, which then force-logs-out the just-logged-in user
        # via axiosClient's 401 interceptor). Rewrite to keep /api/v1/ and only drop "core/".
        location ~ ^/api/v1/core/(.*)$ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Added in Story 1.1 (register/login/me): /api/v1/core/ above does NOT match this path,
        # so without this block it fell through to the SPA fallback below and returned the
        # webgis HTML page instead of JSON. Story 1.3 reviewed gateway-wide policy and kept this
        # route on the same shared burst=20 as other core-api routes (no auth-specific throttling
        # was found to be needed).
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/landslides {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/landslides;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/monitoring-areas {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/monitoring-areas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/community-reports {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/community-reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/forecasts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/forecasts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/alerts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/diagnostic {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/diagnostic;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. AI Inference Service Routing
        location /api/v1/ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ai_service_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
        }

        # 3. GIS Data Service Routing (Satellite query & MVT Vector Tiles)
        location /api/v1/gis/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://gis_service_upstream/api/v1/gis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
        }

        location /api/v1/tiles/ {
            # proxy_cache_valid alone enables no cache; retain the GIS request limit.
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://gis_service_upstream/api/v1/tiles/;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
        }

        # 4. Interactive Swagger / OpenAPI Documentation
        location /swagger-ui/ {
            proxy_pass http://core_api_upstream/swagger-ui/;
            proxy_set_header Host $host;
        }

        location /api-docs {
            proxy_pass http://core_api_upstream/api-docs;
            proxy_set_header Host $host;
        }

        # 5. WebGIS Frontend Client (Single Page App Fallback)
        location / {
            proxy_pass http://webgis_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
