events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream response time & request ID
    log_format microservices '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log microservices;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting: 50 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstream Microservices Definitions (Docker Internal DNS)
    upstream core_api_upstream {
        server core-api:3000;
        keepalive 32;
    }

    upstream ai_service_upstream {
        server ai-service:8001;
        keepalive 16;
    }

    upstream gis_service_upstream {
        server gis-service:8002;
        keepalive 16;
    }

    upstream webgis_upstream {
        server webgis:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Global CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-Id' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Preflight OPTIONS Requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Check
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"terrawatch-api-gateway","timestamp":"$time_iso8601"}';
        }

        # 1. Core API Routing (/api/v1/core/*, /api/v1/auth/*, /api/v1/landslides/*, /api/v1/areas/*, /api/v1/reports/*)
        location /api/v1/core/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/v1/landslides {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/landslides;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/areas {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/areas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/reports {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/alerts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api_upstream/api/v1/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. AI Inference Service Routing
        location /api/v1/ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ai_service_upstream/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;
        }

        # 3. GIS Data Service Routing (Satellite query & MVT Vector Tiles)
        location /api/v1/gis/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://gis_service_upstream/api/v1/gis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
        }

        location /api/v1/tiles/ {
            proxy_pass http://gis_service_upstream/api/v1/tiles/;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
        }

        # 4. Interactive Swagger / OpenAPI Documentation
        location /swagger-ui/ {
            proxy_pass http://core_api_upstream/swagger-ui/;
            proxy_set_header Host $host;
        }

        location /api-docs {
            proxy_pass http://core_api_upstream/api-docs;
            proxy_set_header Host $host;
        }

        # 5. WebGIS Frontend Client (Single Page App Fallback)
        location / {
            proxy_pass http://webgis_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
